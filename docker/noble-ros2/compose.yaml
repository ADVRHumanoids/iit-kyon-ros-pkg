services:
  dev:
    build:
      context: .
      secrets:
        - gh_token
    image: iit-kyon-ros-pkg-test:latest
    stdin_open: true
    tty: true 
    entrypoint: /bin/bash
    restart: no
    volumes:
      - /home/$USER/.ssh:/home/user/.ssh
      - ./scripts:/home/user/scripts
      - ../..:/home/user/test_ws/src/iit-kyon-ros-pkg
    environment:
      - TERM=xterm-256color
      - FOREST_JOBS

secrets:
  gh_token:
    environment: GITHUB_TOKEN