services:
  dev:
    build:
      context: .
    image: iit-kyon-ros-pkg-test:latest
    stdin_open: true
    tty: true 
    entrypoint: /bin/bash
    restart: no
    network_mode: host
    gpus: all
    devices:
      - /dev/input:/dev/input:r
    group_add:
      - "${INPUT_GID:-995}"
    volumes:
      - /home/$USER/.ssh:/home/user/.ssh
      - ./scripts:/home/user/scripts
      - ../..:/home/user/test_ws/src/iit-kyon-ros-pkg
    environment:
      - TERM=xterm-256color
      - FOREST_JOBS
      - DISPLAY
      - ROS_AUTOMATIC_DISCOVERY_RANGE
