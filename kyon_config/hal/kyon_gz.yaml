xbotcore_devices:

    joint_gz:
        names: []
        thread: rt_main

    imu_gz:
        names: []
        thread: rt_main

    link_state_sensor:
        names: []
        thread: rt_main
        type: link_state_sensor
        
    

    joint_gripper_adapter:
        names: [dagana_1, dagana_2]
        thread: rt_main
        params:
            dagana_2/joint_name: {value: dagana_2_clamp_joint, type: string}
            dagana_2/joint_type: {value: joint_gz, type: string}
            dagana_2/qopen: {value: -1.5, type: double}
            dagana_2/qclosed: {value: 0.0, type: double}
            dagana_2/vmax: {value: 1.0, type: double}
            dagana_2/stiffness: {value: 10.0, type: double}
            
            dagana_1/joint_name: {value: dagana_1_clamp_joint, type: string}
            dagana_1/joint_type: {value: joint_gz, type: string}
            dagana_1/qopen: {value: -1.5, type: double}
            dagana_1/qclosed: {value: 0.0, type: double}
            dagana_1/vmax: {value: 1.0, type: double}
            dagana_1/stiffness: {value: 10.0, type: double}
