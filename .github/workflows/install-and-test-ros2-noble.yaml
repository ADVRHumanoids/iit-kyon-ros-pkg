name: Install and Test (Noble-ROS2)

on:
  push:
    branches: [ "ros2" ]
  pull_request:
    branches: [ "ros2" ]

jobs:
  build_mujoco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set lowercase repository name
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}

    - name: Build Docker image (with registry cache)
      uses: docker/build-push-action@v5
      with:
        context: ./docker/noble-ros2
        load: true
        tags: iit-kyon-ros-pkg-test:latest
        secrets: |
          gh_token=${{ secrets.TOKEN }}
        cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/ci-noble:cache
        cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/ci-noble:cache,mode=max

    - name: Start the container
      run: docker compose up --no-build -d
      working-directory: ./docker/noble-ros2

    - name: Compile the library
      run: docker compose exec dev ./scripts/build.bash
      working-directory: ./docker/noble-ros2

    - name: Test robot spawn on MuJoCo
      run: docker compose exec dev ./scripts/test_mujoco.bash
      working-directory: ./docker/noble-ros2

  build_gz-sim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set lowercase repository name
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}

    - name: Build Docker image (with registry cache)
      uses: docker/build-push-action@v5
      with:
        context: ./docker/noble-ros2
        load: true
        tags: iit-kyon-ros-pkg-test:latest
        secrets: |
          gh_token=${{ secrets.TOKEN }}
        cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/ci-noble:cache
        cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/ci-noble:cache,mode=max

    - name: Start the container
      run: docker compose up --no-build -d
      working-directory: ./docker/noble-ros2

    - name: Compile the library
      run: docker compose exec dev ./scripts/build.bash
      working-directory: ./docker/noble-ros2

    - name: Test robot spawn on gz-sim
      run: docker compose exec dev ./scripts/test_gz-sim.bash
      working-directory: ./docker/noble-ros2

