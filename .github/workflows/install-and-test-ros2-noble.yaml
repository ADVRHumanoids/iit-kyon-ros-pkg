name: Install and Test (Noble-ROS2)

on:
  push:
    branches: [ "hesai_jt128" ]
  pull_request:
    branches: [ "hesai_jt128" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}

    - name: Build Docker image (with registry cache)
      uses: docker/build-push-action@v5
      with:
        context: ./docker/noble-ros2
        load: true
        tags: kyon-mujoco-ci:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/ci-noble:cache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/ci-noble:cache,mode=max

    - name: Start the container
      run: docker compose up --no-build -d
      working-directory: ./docker/noble-ros2

    - name: Compile the library
      run: docker compose exec dev ./scripts/build.bash
      working-directory: ./docker/noble-ros2

    - name: Test robot spawn on MuJoCo
      run: docker compose exec dev xvfb-run ros2 launch kyon_mujoco kyon_world.launch.py
      working-directory: ./docker/noble-ros2