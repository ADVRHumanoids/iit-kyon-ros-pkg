solver_options:
    regularization: 1e-2
    back_end: osqp
    
stack:
    - [contact_1, contact_2, contact_3, contact_4, pelvis, postural]
    # - [Postural, Com, PelvisRot]

constraints: 
    - jlim
    - vlim

jlim:
    type: JointLimits

vlim:
    type: VelocityLimits

contact_1:
    type: Cartesian
    distal_link: contact_1
    base_link: world
    indices: [0, 1, 2]
    
contact_2:
    type: Cartesian
    distal_link: contact_2
    base_link: world
    indices: [0, 1, 2]
    
contact_3:
    type: Cartesian
    distal_link: contact_3
    base_link: world
    indices: [0, 1, 2]
    
contact_4:
    type: Cartesian
    distal_link: contact_4
    base_link: world
    indices: [0, 1, 2]

pelvis:
    type: Cartesian
    distal_link: pelvis
    base_link: world 
    indices: [0, 1, 2, 3, 4, 5]
    use_local_subtasks: true
    lambda: 0.1
    
postural:
    type: Postural
    lambda: 0.00
    weight: 0.001
    
