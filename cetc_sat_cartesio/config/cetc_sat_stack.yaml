solver_options:
    regularization: 1e-2
    back_end: "osqp"
    
stack:
    - ["Ball1", "Ball2", "Ball3", "Ball4"]
    - ["Com"]
    - ["LeftArm", "RightArm"]
    
Ball1:
    type: "Cartesian"
    distal_link: "ball_1"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball2:
    type: "Cartesian"
    distal_link: "ball_2"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball3:
    type: "Cartesian"
    distal_link: "ball_3"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball4:
    type: "Cartesian"
    distal_link: "ball_4"
    base_link: "world"
    indices: [0, 1, 2]
    
LeftArm:
    type: "Cartesian"
    distal_link: "ball_arm_1"
    base_link: "world" 
    
RightArm:
    type: "Cartesian"
    distal_link: "ball_arm_2"
    base_link: "world"
    
Com:
    type: "Com"
    indices: [0, 1, 2]
