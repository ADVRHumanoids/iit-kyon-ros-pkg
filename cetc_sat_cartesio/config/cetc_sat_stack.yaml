solver_options:
    regularization: 1e-2
    back_end: "osqp"
    
stack:
    - ["Ball1", "Ball2", "Ball3", "Ball4"]
    # - ["Com"]
    - ["RightArm", "Ball1_Yaw", "Ball2_Yaw", "Ball3_Yaw", "Ball4_Yaw"] #, "LeftArm"]
    - ["Pelvis", "Postural"]
    
Ball1:
    type: "Cartesian"
    distal_link: "ball_1"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball2:
    type: "Cartesian"
    distal_link: "ball_2"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball3:
    type: "Cartesian"
    distal_link: "ball_3"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball4:
    type: "Cartesian"
    distal_link: "ball_4"
    base_link: "world"
    indices: [0, 1, 2]
    
Ball1_Yaw:
    type: "Subtask"
    task: "Ball1"
    indices: [3, 4]
	
Ball2_Yaw:
    type: "Subtask"
    task: "Ball2"
    indices: [3, 4]
	
Ball3_Yaw:
    type: "Subtask"
    task: "Ball3"
    indices: [3, 4]
	
Ball4_Yaw:
    type: "Subtask"
    task: "Ball4"
    indices: [3, 4]
	
LeftArm:
    type: "Cartesian"
    distal_link: "dagana_1_bottom_link"
    base_link: "world" 
    indices: [0, 1, 2] #, 3, 4, 5]
    
RightArm:
    type: "Cartesian"
    distal_link: "dagana_2_bottom_link"
    base_link: "world"
    indices: [0, 1, 2, 3, 4, 5]
    
Com:
    type: "Com"
    indices: [0, 1, 2]
    
Postural:
    type: "Postural"
    lambda: 0.1
    
Pelvis:
    type: "Cartesian"
    distal_link: "pelvis"
    weight: 100
