# sim_hesai_adapter: kyon_gazebo's hesai_qt128 gpu_lidar -> Hesai QT128 driver cloud.

/sim_hesai_adapter:
  ros__parameters:
    input_topic: /hesai_qt128/points
    output_topic: /lidar_points
    frame_id: hesai_lidar                 # as the real driver
    ground_truth_topic: /sim/ground_truth
    base_frame: pelvis                    # frame of the ground truth (xacro arg ground_truth)
    # The sensor in lidar_parent_frame (x y z roll pitch yaw): kyon_gazebo.urdf.xacro's hesai_qt128_*
    lidar_parent_frame: imu_link
    lidar_pose: [0.6862, 0.0, -0.015, 3.141592653589793, 0.0, -2.0928021889929584]
    scan_period: 0.1
    start_azimuth_deg: 96.0               # the sweep is clockwise, as the real one (01102026, 08102026 bags)
    # Must match urdf/kyon_sensors.urdf.xacro's hesai_qt128
    rows: 264
    min_elevation_deg: -52.8
    max_elevation_deg: 52.4
    # Elevations of the 128 rings (deg, sensor frame), measured on /lidar_points of
    # logs/08102026_iit_floor (exact: the driver applies the per-channel calibration)
    ring_elevations_deg: [-52.72, -51.15, -49.59, -48.16, -46.78, -45.46, -44.13, -42.9, -41.65,
